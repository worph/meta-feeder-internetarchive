[package]
name = "internetarchive-feeder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Internet Archive free audio (etree, netlabels, 78rpm). Open, keyless.
# Upstream: Internet Archive (archive.org)

[lib]
name = "internetarchive_feeder"
path = "src/lib.rs"

[[bin]]
name = "internetarchive-feeder"
path = "src/main.rs"

[dependencies]
# Pinned by TAG, not rev or path. The tag is the SDK's release identity, and it
# is the one form every feeder in the fleet can be lined up on.
#
# ⚠ It must never go back to `path = "../../../meta-feeder-sdk"`. That resolves
# OUTSIDE this repo, and this repo is the Docker build context — so the image
# build died at manifest resolution with a bare "No such file or directory",
# and, worse, this crate became unconsumable as a git dependency by anyone
# ("no matching package named `meta-feeder-sdk`"), because a consumer's checkout
# has no such sibling directory either. A path dep here is not a local
# convenience; it is a defect visible to every downstream repo.
meta-feeder-sdk = { git = "https://github.com/worph/meta-feeder-sdk", tag = "v1.7.0" }

tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
bytes = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
redb = "2"
base64 = "0.22"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1.40", features = ["full", "test-util"] }
